# Google App Engine configuration for Argus
runtime: python39

env_variables:
  PYTHONUNBUFFERED: "1"
  ARMORIQ_MODE: "mock"
  PORT: "8080"

automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

handlers:
- url: /_stcore/.*
  static_dir: .
  secure: always

- url: /.*
  script: auto
  secure: always

# Health check
readiness_check:
  path: "/"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2